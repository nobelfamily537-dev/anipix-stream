[build]
  publish = "."
  # Skip the build entirely when a commit only touches library.json.
  # Publishing content therefore costs no Netlify build credits —
  # the site and the app both read library.json from GitHub at runtime.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!library.json'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer-when-downgrade"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
