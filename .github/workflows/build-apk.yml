name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Add android platform folder
        run: |
          flutter create --platforms=android --org com.anipixstream --project-name anipix_stream /tmp/scaffold
          cp -r /tmp/scaffold/android ./app/android
          sed -i 's/android:label="anipix_stream"/android:label="AniPix Stream"/' app/android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp app/assets/icon/mipmap-$d/ic_launcher.png app/android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Start.io + permissions config
        run: |
          python3 app/android_extra/patch_android.py
          find app/android/app/src/main -name "MainActivity.kt" -delete
          mkdir -p app/android/app/src/main/java/com/anipixstream/anipix_stream
          cp app/android_extra/*.java app/android/app/src/main/java/com/anipixstream/anipix_stream/
          echo "--- java files ---"
          find app/android/app/src/main -name "MainActivity.*"

      - name: Use a stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/keystore.b64 > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK (universal)
        working-directory: app
        run: flutter build apk --release

      - name: Show sizes
        run: ls -lh app/build/app/outputs/flutter-apk/ || true

      - name: Publish release (used by the in-app updater)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version: $VER"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VER" app/build/app/outputs/flutter-apk/app-release.apk#AniPix-Stream.apk \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VER" app/build/app/outputs/flutter-apk/app-release.apk#AniPix-Stream.apk \
              --title "AniPix Stream v$VER" \
              --notes "AniPix Stream v$VER - new build" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: anipix-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
