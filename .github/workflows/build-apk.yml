name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Add android platform folder
        run: |
          flutter create --platforms=android --org com.anipixstream --project-name anipix_stream /tmp/scaffold
          cp -r /tmp/scaffold/android ./app/android
          sed -i 's/android:label="anipix_stream"/android:label="AniPix Stream"/' app/android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp app/assets/icon/mipmap-$d/ic_launcher.png app/android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Add INTERNET permission
        run: |
          python3 - <<'PY'
          p = 'app/android/app/src/main/AndroidManifest.xml'
          src = open(p).read()
          if 'android.permission.INTERNET' not in src:
              src = src.replace('<application',
                                '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
              open(p, 'w').write(src)
          print('INTERNET permission present:', 'android.permission.INTERNET' in open(p).read())
          PY

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK (universal)
        working-directory: app
        run: flutter build apk --release

      - name: Show sizes
        run: ls -lh app/build/app/outputs/flutter-apk/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: anipix-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
