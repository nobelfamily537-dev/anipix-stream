name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Add android platform folder
        run: |
          flutter create --platforms=android --org com.anipixstream --project-name anipix_stream /tmp/scaffold
          cp -r /tmp/scaffold/android ./app/android
          sed -i 's/android:label="anipix_stream"/android:label="AniPix Stream"/' app/android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp app/assets/icon/mipmap-$d/ic_launcher.png app/android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Start.io + permissions config
        run: |
          python3 - <<'PY'
          import os, re

          base = 'app/android/app'
          gradle = os.path.join(base, 'build.gradle')
          s = open(gradle).read()
          s = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', s)
          s = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', s)
          if 'inapp-sdk' not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation 'com.startapp:inapp-sdk:5.4.0'", 1)
          if 'sourceCompatibility' not in s:
              s = s.replace('android {',
                            "android {\n    compileOptions {\n"
                            "        sourceCompatibility JavaVersion.VERSION_17\n"
                            "        targetCompatibility JavaVersion.VERSION_17\n"
                            "    }\n", 1)
          open(gradle, 'w').write(s)
          print('gradle patched')

          mf = os.path.join(base, 'src/main/AndroidManifest.xml')
          m = open(mf).read()
          if 'android.permission.INTERNET' not in m:
              m = re.sub(r'(<application[^>]*>)',
                         r'<uses-permission android:name="android.permission.INTERNET"/>\n    \1', m, count=1)
          if 'android.permission.AD_ID' not in m:
              m = re.sub(r'(<application[^>]*>)',
                         r'<uses-permission android:name="android.permission.AD_ID"/>\n    \1', m, count=1)
          if 'com.startapp.sdk.APPLICATION_ID' not in m:
              m = re.sub(r'(<application[^>]*>)',
                         r'\1\n        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="210377175" />',
                         m, count=1)
          open(mf, 'w').write(m)
          print('manifest patched')
          PY

          find app/android/app/src/main -name "MainActivity.kt" -delete
          mkdir -p app/android/app/src/main/java/com/anipixstream/anipix_stream
          cp app/android_extra/MainActivity.java app/android/app/src/main/java/com/anipixstream/anipix_stream/MainActivity.java
          echo "--- manifest ---"
          grep -E "INTERNET|AD_ID|startapp|android:label" app/android/app/src/main/AndroidManifest.xml || true

      - name: Use a stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/keystore.b64 > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK (universal)
        working-directory: app
        run: flutter build apk --release

      - name: Show sizes
        run: ls -lh app/build/app/outputs/flutter-apk/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: anipix-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
