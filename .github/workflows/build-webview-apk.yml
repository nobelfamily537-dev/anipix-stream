name: Build WebView APK

on:
  push:
    paths:
      - 'webview/**'
      - '.github/workflows/build-webview-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > webview/local.properties

      - name: Stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d app/keystore.b64 > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Build release APK
        working-directory: webview
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show output
        run: ls -lh webview/app/build/outputs/apk/release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: anipix-webview-apk
          path: webview/app/build/outputs/apk/release/*.apk
          retention-days: 30
