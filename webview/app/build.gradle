plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anipixstream.anipix_stream'
    compileSdk 34

    defaultConfig {
        applicationId "com.anipixstream.anipix_stream"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.0.5"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external dependencies: plain framework Activity + WebView.
dependencies { }
